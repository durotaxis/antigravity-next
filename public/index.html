<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stride Analysis :: VS World Record</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>STRIDE ANALYSIS</h1>
            <div class="subtitle">Peak Performance Control</div>
        </header>

        <section class="controls glass-card">
            <input type="date" id="dateInput">
            <button id="analyzeBtn" class="btn-primary">RUN ANALYZER</button>
            <label class="batch-toggle">
                <input type="checkbox" id="geminiToggle" checked>
                <span>Use OpenAI Advice API</span>
            </label>
        </section>

        <section id="batch-ocr" class="glass-card">
            <h3 style="margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase; font-size: 0.9rem;">
                Batch OCR
            </h3>
            <div class="batch-toolbar" style="margin-bottom: 10px;">
                <label class="batch-toggle" for="snapshotDateInput">Snapshot Date (LOAD IMAGES)</label>
                <input type="date" id="snapshotDateInput">
            </div>
            <div class="batch-toolbar">
                <label class="batch-toggle">
                    <input type="checkbox" id="batchPersistToggle" checked>
                    <span>Persist to DB</span>
                </label>
                <label class="batch-toggle">
                    <input type="checkbox" id="batchVisionToggle" checked>
                    <span>Use Vision (Python OCR)</span>
                </label>
                <button id="batchLoadImagesBtn" class="btn-primary batch-load-btn" type="button">LOAD IMAGES</button>
            </div>
            <div id="batchImagePicker" class="batch-image-picker">No images loaded yet.</div>
            <textarea id="batchFilenamesInput" class="batch-input"
                placeholder="Optional: one stored filename per line (manual input)&#10;Example:&#10;upload_04a5cee87050.png"></textarea>
            <div class="batch-actions">
                <button id="runBatchBtn" class="btn-primary">RUN BATCH</button>
            </div>
            <pre id="batchResult" class="batch-result">Batch result will appear here.</pre>
        </section>

        <section>


            <div id="daily-message-container" class="glass-card"
                style="margin: 20px auto; padding: 15px; text-align: center; color: #fff; font-size: 1.1rem; display: none;">
                <span id="daily-message-text"></span>
            </div>

            <div
                style="width: 90%; margin: 20px auto; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333;">
                <canvas id="strideChart"></canvas>
            </div>

            <section id="summary">
                <!-- Summary stats will be injected here -->
            </section>

            <section class="glass-card data-table-container">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Steps</th>
                            <th>Dist (m)</th>
                            <th>Stride (cm)</th>
                            <th>Velocity (km/h)</th>
                            <th>Heart Rate</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </section>

            <section class="glass-card">
                <h3
                    style="margin-bottom: 15px; color: var(--text-secondary); text-transform: uppercase; font-size: 0.9rem;">
                    Run History</h3>
                <div class="data-table-container" style="max-height: 300px; overflow-y: auto;">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Max Stride</th>
                                <th>Max HR</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- History rows injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
    </div>

    <!-- Inbox Picker Modal -->
    <div id="inboxModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Select Image from Phone Link</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="inboxGrid" class="inbox-grid">
                    <!-- Thumbnails injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="importBtn" class="btn-primary" disabled>Import Selected</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox-overlay">
        <div class="lightbox-controls">
            <button id="lbUnlinkBtn" class="lb-control-btn delete" title="Unlink Image" style="display:none;">Delete</button>
            <button id="lbCloseBtn" class="lb-control-btn close" title="Close">Close</button>
        </div>
        <img id="lightboxImg" class="lightbox-content" src="" alt="Full View">
    </div>

    <!-- Logic -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
