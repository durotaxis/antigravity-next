<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stride Analysis :: VS World Record</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>STRIDE ANALYSIS</h1>
            <div class="subtitle">Peak Performance Control</div>
        </header>

        <section class="controls glass-card" id="analyzerControls">
            <div class="control-primary">
                <input type="date" id="dateInput" title="Run Date (RUN ANALYZER)">
                <button id="analyzeBtn" class="btn-primary">RUN ANALYZER</button>
            </div>
            <div class="control-options">
                <label class="batch-toggle">
                    <input type="radio" name="adviceProvider" id="openaiAdviceToggle" value="openai" checked>
                    <span>OpenAI Advice API</span>
                </label>
                <label class="batch-toggle">
                    <input type="radio" name="adviceProvider" id="geminiAdviceToggle" value="gemini">
                    <span>Gemini Advice API</span>
                </label>
            </div>
        </section>

        <section>


            <div id="daily-message-container" class="glass-card"
                style="margin: 20px auto; padding: 15px; text-align: center; color: #fff; font-size: 1.1rem; display: none;">
                <span id="daily-message-text"></span>
            </div>

            <div
                style="width: 90%; margin: 20px auto; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333;">
                <canvas id="strideChart"></canvas>
            </div>

            <section id="summary">
                <!-- Summary stats will be injected here -->
            </section>

            <section class="glass-card data-table-container">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Steps</th>
                            <th>Dist (m)</th>
                            <th>Stride (cm)</th>
                            <th>Velocity (km/h)</th>
                            <th>Heart Rate</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </section>

            <section class="controls glass-card" id="debugControls">
                <div class="debug-frame-label">DEBUG</div>
                <div class="control-primary">
                    <input type="date" id="fitSyncFromDateInput" title="From Date (SYNC FIT JSON)">
                    <button id="syncJsonBtn" class="btn-primary" type="button">SYNC FIT JSON</button>
                    <span id="fitSyncHint" class="batch-toggle"></span>
                </div>
                <div class="control-primary">
                    <input type="date" id="snapshotDateInput" title="From Date (SYNC DAILY DEBUG)">
                    <button id="imageImportBtn" class="btn-primary" type="button">SYNC DAILY</button>
                    <div class="control-options inline-options">
                        <label class="batch-toggle">
                            <input type="radio" name="batchOcrMode" id="batchOcrModePython" value="python" checked>
                            <span>Python OCR</span>
                        </label>
                        <label class="batch-toggle">
                            <input type="radio" name="batchOcrMode" id="batchOcrModeVision" value="vision">
                            <span>Vision OCR</span>
                        </label>
                    </div>
                    <span id="imageImportHint" class="batch-toggle"></span>
                </div>
                <div class="control-primary">
                    <input type="date" id="clearDateInput" title="Date (CLEAR DEBUG)">
                    <button id="clearDebugBtn" class="btn-primary" type="button">CLEAR RUN</button>
                    <div class="control-options inline-options">
                        <label class="batch-toggle">
                            <input type="radio" name="clearMode" id="clearModeFitJson" value="fit_json">
                            <span>Fit JSON</span>
                        </label>
                        <label class="batch-toggle">
                            <input type="radio" name="clearMode" id="clearModeDaily" value="daily" checked>
                            <span>Daily</span>
                        </label>
                    </div>
                </div>
                <div class="control-primary">
                    <button id="openPickerBtn" class="btn-primary" type="button" disabled>+ Select Image from Phone Link (without SYNC DAILY)</button>
                </div>
                <div class="control-primary">
                    <label for="heightCmInput" class="batch-toggle">Height(cm)</label>
                    <input type="number" id="heightCmInput" min="100" max="250" step="1" placeholder="170">
                    <button id="saveHeightBtn" class="btn-primary" type="button">SAVE HEIGHT</button>
                    <span id="heightInfo" class="batch-toggle debug-side-info"></span>
                </div>
                <div class="control-primary">
                    <label for="ageInput" class="batch-toggle">Age</label>
                    <input type="number" id="ageInput" min="1" max="120" step="1" placeholder="50">
                    <button id="saveAgeBtn" class="btn-primary" type="button">SAVE AGE</button>
                    <span id="hrFormulaInfo" class="batch-toggle debug-side-info">Max HR = 220 - age</span>
                </div>
                <div class="control-primary">
                    <label for="restingHrInput" class="batch-toggle">Rest HR</label>
                    <input type="number" id="restingHrInput" min="30" max="120" step="1" placeholder="60">
                    <button id="saveRestHrBtn" class="btn-primary" type="button">SAVE REST HR</button>
                    <span id="hrTargetInfo" class="batch-toggle debug-side-info">LTHR / Z2 will appear here</span>
                </div>
            </section>

            <section class="glass-card">
                <h3
                    style="margin-bottom: 15px; color: var(--text-secondary); text-transform: uppercase; font-size: 0.9rem;">
                    Run History</h3>
                <div class="data-table-container" style="max-height: 300px; overflow-y: auto;">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Max Stride</th>
                                <th>Max HR</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- History rows injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
    </div>

    <!-- Inbox Picker Modal -->
    <div id="inboxModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Select Image from Phone Link</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="inboxGrid" class="inbox-grid">
                    <!-- Thumbnails injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="importBtn" class="btn-primary" disabled>Import Selected</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox-overlay">
        <div class="lightbox-controls">
            <button id="lbUnlinkBtn" class="lb-control-btn delete" title="Unlink Image" style="display:none;">Delete</button>
            <button id="lbCloseBtn" class="lb-control-btn close" title="Close">Close</button>
        </div>
        <img id="lightboxImg" class="lightbox-content" src="" alt="Full View">
    </div>

    <!-- Logic -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js?v=20260222-1"></script>
</body>

</html>
